name: tests

# Offline test suite (pytest, mocked HTTP; no secrets, no ffmpeg, no network).
# Runs on pull requests and branch pushes, and is called by build-push-dockerhub
# so a failing test blocks the image build on main.

on:
  pull_request:
  push:
    branches-ignore: [main]   # main runs it through build-push-dockerhub
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
