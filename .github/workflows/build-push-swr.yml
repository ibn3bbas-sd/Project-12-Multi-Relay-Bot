name: build-push-swr

on:
  push:
    branches: [main]
    paths: [src/**, config/**, requirements.txt, Dockerfile]
  workflow_dispatch:

# Repo secrets required:
#   SWR_REGISTRY   e.g. swr.me-east-1.myhuaweicloud.com   (match your CCE region)
#   SWR_ORG        your SWR organization
#   SWR_USERNAME   <region>@<AK>              (from SWR console > "Generate login command")
#   SWR_PASSWORD   long-term login key
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_ORG }}/youtube-relay-bot:latest
            ${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_ORG }}/youtube-relay-bot:${{ github.sha }}
