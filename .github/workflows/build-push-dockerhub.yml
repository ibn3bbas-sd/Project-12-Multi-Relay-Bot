name: build-push-dockerhub

# push to main -> build linux/amd64 image -> push to Docker Hub as :latest and :<sha>.
# Then on the cluster: kubectl -n relay-bot rollout restart deploy/relay-bot
#
# Repo SECRET (Settings > Secrets and variables > Actions > Secrets):
#   DOCKERHUB_TOKEN     Docker Hub personal access token, scope Read & Write
#                       (hub.docker.com > Account settings > Personal access tokens)
# Repo VARIABLE (same page > Variables), optional:
#   DOCKERHUB_USERNAME  defaults to ibn3bbas
#
# Create the repo ibn3bbas/youtube-relay-bot as PRIVATE on Docker Hub before the
# first push; a repo auto-created by a push follows the account default (public).

on:
  push:
    branches: [main]
    paths: [src/**, config/**, requirements.txt, Dockerfile, .github/workflows/build-push-dockerhub.yml]
  workflow_dispatch:

concurrency:
  group: build-push-dockerhub
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HUB_USER: ${{ vars.DOCKERHUB_USERNAME || 'ibn3bbas' }}
      IMAGE: ${{ vars.DOCKERHUB_USERNAME || 'ibn3bbas' }}/youtube-relay-bot
    steps:
      - name: Check registry settings
        env:
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$HUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_TOKEN is empty - see the header of this workflow"; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ env.HUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # linux/amd64 only: CCE nodes are x86.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            docker.io/${{ env.IMAGE }}:latest
            docker.io/${{ env.IMAGE }}:${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo "- \`docker.io/${IMAGE}:latest\`"
            echo "- \`docker.io/${IMAGE}:${GITHUB_SHA}\`"
            echo
            echo "Roll out: \`kubectl -n relay-bot rollout restart deploy/relay-bot\`"
          } >> "$GITHUB_STEP_SUMMARY"
