# YouTube Relay Bot on Huawei Cloud CCE — one file, `kubectl apply -f k8s/relay-bot.yaml`
#
# Before applying:
#   1. Create the dockerhub-pull Secret (private Docker Hub repo).
#   2. Create relay-bot-env + relay-bot-files + ytdlp-cookies (see docs/deploy-cce.md) — NOT in this file.
#
# No Service / Ingress: the bot only makes outbound calls (Telegram polling, YouTube).
---
apiVersion: v1
kind: Namespace
metadata:
  name: relay-bot
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: relay-data
  namespace: relay-bot
  annotations:
    everest.io/disk-volume-type: SAS        # EVS type: SAS | SSD | GPSSD
    everest.io/set-disk-tags: "true"        # account policy denies untagged EVS creation (403)
spec:
  accessModes: [ReadWriteOnce]
  # -topology = WaitForFirstConsumer: the disk is created in the AZ of the node the
  # pod lands on. Plain csi-disk (Immediate) was refused with 403 on this account.
  storageClassName: csi-disk-topology
  resources:
    requests:
      storage: 20Gi                         # processed IDs + token + video scratch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-bot
  namespace: relay-bot
  labels: { app: relay-bot }
spec:
  replicas: 1                               # never >1: two pods = double uploads
  strategy:
    type: Recreate                          # no overlap during rollout; EVS is RWO anyway
  selector:
    matchLabels: { app: relay-bot }
  template:
    metadata:
      labels: { app: relay-bot }
    spec:
      imagePullSecrets:
        - name: dockerhub-pull              # docker-registry Secret, read-only Docker Hub token
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001                      # makes the EVS volume writable
      initContainers:
        # Seed the YouTube OAuth token onto the volume once. After that the app
        # refreshes and rewrites it there; the Secret copy is only a bootstrap.
        - name: seed-token
          image: busybox:1.36
          command: ["sh", "-c", "[ -f /data/token.json ] || cp /secrets/token.json /data/token.json; mkdir -p /data/downloads"]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: secrets, mountPath: /secrets, readOnly: true }
      containers:
        - name: bot
          image: docker.io/ibn3bbas/youtube-relay-bot:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef: { name: relay-bot-env }   # TELEGRAM_*, GEMINI_API_KEY ...
          env:
            - { name: DATA_DIR, value: /data }
            - { name: DOWNLOAD_DIR, value: /data/downloads }
            - { name: YOUTUBE_TOKEN_FILE, value: /data/token.json }
            - { name: YOUTUBE_CLIENT_SECRET_FILE, value: /secrets/client_secret.json }
            - { name: YTDLP_COOKIES_FILE, value: /cookies/cookies.txt }   # cloud IP bot-check
            - { name: TZ, value: Asia/Riyadh }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "1",  memory: 1Gi }      # ffmpeg merge spikes
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: secrets, mountPath: /secrets, readOnly: true }
            - { name: cookies, mountPath: /cookies, readOnly: true }
            - { name: logs, mountPath: /app/logs }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: relay-data }
        - name: secrets
          secret:
            secretName: relay-bot-files       # token.json + client_secret.json
        - name: cookies
          secret:
            secretName: ytdlp-cookies         # cookies.txt; refresh = replace the Secret
            defaultMode: 0440               # root:fsGroup 10001, group-readable
            optional: true                    # pod still starts; downloads hit the bot-check
        - name: logs
          emptyDir: {}                        # stdout is the real log; file is a convenience
        - name: tmp
          emptyDir: {}
---
# Nothing should ever connect to the bot. Egress: DNS + HTTPS only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay-bot
  namespace: relay-bot
spec:
  podSelector: { matchLabels: { app: relay-bot } }
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: TCP, port: 443 }
